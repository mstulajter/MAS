#################################################################
#
# Build configuration file template for MAS with CUSPARSE support.
#
# This configuration enables GPU acceleration using NVIDIA's cuSPARSE
# library for sparse matrix operations in the preconditioner.
#
#################################################################
# Enter your MPI compiler (e.g. "mpif90", "mpifort", etc.).
#################################################################

FC: mpif90

###########################################################################
# Please set the compile flags based on your compiler and hardware setup.
# 
# Note: This configuration includes CUSPARSE support.
# The C files (lusol_cusparse.c and lusol_cusparse_sp.c) must be compiled
# separately with: nvc -O3 -march=native -acc=gpu -gpu=nomanaged,nounified 
#                  -Minfo=accel -cudalib=cusparse -lnvJitLink -c <file>.c
#
# Flags explanation:
#   -DCUSPARSE          : Enables cusparse code paths in mas.F90
#   -cudalib=cusparse    : Links against cuSPARSE library
#   -lnvJitLink         : NVIDIA JIT linker library (required for cusparse)
###########################################################################

FRTFLAGS: -O3 -march=native -acc=gpu -stdpar=gpu -gpu=ccnative,mem:separate -Minfo=accel -DCUSPARSE -cudalib=cusparse -lnvJitLink

#################################################################
# Please set the location of the HDF5 include & library files. 
# Make sure the HDF5 LIBRARY is COMPILED with 
# the SAME COMPILER used here, and is in the run-time environment.
#################################################################

HDF5_INCLUDE_DIR: ${PS_EXT_DEPS_HOME}/hdf5/include
HDF5_LIB_DIR: ${PS_EXT_DEPS_HOME}/hdf5/lib

##################################################################
# Please set the HDF5 linker flags to match the installed version.
##################################################################

HDF5_LIB_FLAGS: -lhdf5_fortran -lhdf5hl_fortran -lhdf5 -lhdf5_hl

